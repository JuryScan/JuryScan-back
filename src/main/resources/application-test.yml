spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: ${H2_USER:test}
    password: ${H2_PASSWORD:test}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

# Configurações personalizadas para testes
api:
  uri: /api/v1
  integration:
    services:
      ai-analyzer:
        url: http://localhost:8080
        api-key: test-api-key
  pricing:
    analysis-cost: ${ANALYSIS_COST:1}

# Actuator para testes
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
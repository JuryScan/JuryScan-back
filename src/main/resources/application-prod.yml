spring:
  application:
    name: JuryScan-API-prod
  datasource:
    url: ${PG_URL_PROD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Only validate the db schema
  flyway:
    enabled: true
    default-schema: public
    locations: classpath:db/migration
    validate-on-migrate: false
  thymeleaf:
    cache: true
    check-template-location: true
    prefix: classpath:/templates/
    suffix: .html

server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

# Configurações personalizadas da aplicação
api:
  uri: /api/v1
  base-url: ${API_BASE_URL:https://juryscan-back-prod.onrender.com}
  data-load:
    create-default-users: ${CREATE_DEFAULT_USERS:false}
    create-dump-data: ${CREATE_DUMP_DATA:false}
  security:
    token:
      secret: ${JWT_SECRET}
  integration:
    services:
      ai-analyzer:
        url: ${AI_ANALYZER_URL:}
        api-key: ${AI_ANALYZER_API_KEY:}
  pricing:
    analysis-cost: ${ANALYSIS_COST:1}

# URL do frontend (retorno do gateway de pagamento)
app:
  frontend-url: ${APP_FRONTEND_URL:https://jury-scan-front-end.vercel.app}

# Configurações do Google
google:
  recaptcha:
    secret: ${GOOGLE_RECAPTCHA_SECRET_KEY}

# Configurações do Stripe
stripe:
  secret:
    key: ${STRIPE_SECRET_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}

# Actuator para health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Detalhes apenas para usuários autorizados
      show-details: when-authorized
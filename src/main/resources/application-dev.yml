spring:
  application:
    name: JuryScan-API-dev
  datasource:
    url: ${PG_URL_DEV}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate # Only validate the db schema
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    default-schema: public

server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

logging:
  level:
    org.hibernate: DEBUG
    org.springframework.security: DEBUG

api:
  uri: /api/v1
  data-load:
    create-default-users: ${CREATE_DEFAULT_USERS:false}
    create-dump-data: ${CREATE_DUMP_DATA:false}
  security:
    token:
      secret: ${JWT_SECRET}

google:
  gemini:
    api:
      key: ${GEMINI_API_KEY}
    model: gemini-2.5-flash
  recaptcha:
    secret: ${GOOGLE_RECAPTCHA_SECRET_KEY}

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}